<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正多边形尺规作图</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]] }, svg: { fontCache: "global" } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <header>
    <h1>正 n 边形尺规作图动画</h1>
    <div class="controls">
      <label>n =
        <input id="n-input" type="number" min="1" step="1" value="17" inputmode="numeric">
      </label>
      <button id="go-btn">作图</button>
      <span class="sep"></span>
      <button id="play-btn" disabled>暂停</button>
      <button id="step-btn" disabled>单步</button>
      <button id="replay-btn" disabled>重播</button>
      <label class="speed">速度
        <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1">
        <span id="speed-val">1.0×</span>
      </label>
      <label class="speed">淡出
        <input id="decay" type="range" min="0" max="1" step="0.01" value="0.05" title="旧步骤随之褪色，便于观察大 n">
        <span id="decay-val">0.05</span>
      </label>
      <span class="sep"></span>
      <button id="theme-btn" title="切换深色 / 浅色主题">浅色</button>
    </div>
    <div id="status" class="status"></div>
    <div id="factorization" class="factorization"></div>
  </header>

  <main>
    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="canvas" width="900" height="900"></canvas>
        <div class="zoom-controls">
          <button id="zoom-in" title="放大">＋</button>
          <button id="zoom-out" title="缩小">－</button>
          <button id="zoom-reset" title="复位">复位</button>
        </div>
      </div>
    </section>
    <aside class="panel">
      <div class="panel-head">绘图命令 <span id="cmd-count"></span></div>
      <ol id="cmd-list"></ol>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
